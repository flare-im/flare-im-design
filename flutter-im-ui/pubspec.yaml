name: flare_im_ui
description: >-
  Flare IM UI Kit — Flutter component package (L1). One neutral design contract
  (flare-im-ui-spec), realised natively; design tokens generated from
  flare-im-design-tokens. Components are pure/presentational — behaviour and data
  come from the core observable views via the app.
version: 1.0.4
repository: https://github.com/flare-im/flare-im-design

environment:
  sdk: ^3.10.1
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  # Emoji-pack + sticker resources. `assets/emoji-sticker` is a symlink to the
  # cross-platform source of truth at flare-im-design/assets/emoji-sticker, so
  # this package ships the same webp + manifest every platform uses.
  assets:
    - assets/emoji-sticker/manifest.json
    - assets/emoji-sticker/emoji-locales.json
    - assets/emoji-sticker/emoji/
    - assets/emoji-sticker/stickers/classic/
    - assets/emoji-sticker/stickers/default/
