name: flare_plugin_bundle_host_ios
description: >-
  Apple implementation of flare_plugin_bundle_host using the SwiftUI kit's
  WebKit host in Flutter platform views. Swift Package Manager only, iOS 16
  and macOS 13 or later.
version: 0.1.0
publish_to: none
repository: https://github.com/flare-im/flare-im-design
resolution: workspace

environment:
  sdk: ^3.10.1
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    implements: flare_plugin_bundle_host
    platforms:
      ios:
        pluginClass: FlarePluginBundleHostPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: FlarePluginBundleHostPlugin
        sharedDarwinSource: true
