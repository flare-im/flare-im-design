name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Design system contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 拉取表情 / 贴纸素材（webp 不入库，见 assets/emoji-sticker/fetch-assets.sh）
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash assets/emoji-sticker/fetch-assets.sh
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  vue:
    name: Vue package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 拉取表情 / 贴纸素材（webp 不入库，见 assets/emoji-sticker/fetch-assets.sh）
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash assets/emoji-sticker/fetch-assets.sh
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix packages/vue-im-ui test
      - run: npm --prefix packages/vue-im-ui run typecheck
      - run: npm --prefix packages/vue-im-ui run build
      - run: npm --prefix packages/vue-im-ui run pack
      - run: node tooling/check-package-exports.mjs

  website:
    name: Website and visual regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 拉取表情 / 贴纸素材（webp 不入库，见 assets/emoji-sticker/fetch-assets.sh）
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash assets/emoji-sticker/fetch-assets.sh
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix website run build
      - run: npx --prefix website playwright install --with-deps chromium
      - run: npm --prefix website run test:visual

  flutter:
    name: Flutter package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/flutter-im-ui
    steps:
      - uses: actions/checkout@v4
      - name: 拉取表情 / 贴纸素材（webp 不入库，见 assets/emoji-sticker/fetch-assets.sh）
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash assets/emoji-sticker/fetch-assets.sh
        working-directory: .
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: dart pub publish --dry-run
      - run: flutter pub get
        working-directory: examples/flutter
      - run: flutter build web
        working-directory: examples/flutter

  android:
    name: Android Compose package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/android-im-ui
    steps:
      - uses: actions/checkout@v4
      - name: 拉取表情 / 贴纸素材（webp 不入库，见 assets/emoji-sticker/fetch-assets.sh）
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash assets/emoji-sticker/fetch-assets.sh
        working-directory: .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Emulator interaction regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          working-directory: packages/android-im-ui
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            packages/android-im-ui/build/reports/
            packages/android-im-ui/build/outputs/aar/

  swift:
    name: SwiftUI package
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/ios-im-ui
    steps:
      - uses: actions/checkout@v4
      - name: 拉取表情 / 贴纸素材（webp 不入库，见 assets/emoji-sticker/fetch-assets.sh）
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash assets/emoji-sticker/fetch-assets.sh
        working-directory: .
      - run: swift package resolve
      - run: ./sync-resources.sh
      - run: swift test
      - run: swift build
      - run: xcodebuild -scheme FlareIMUI -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/flare-ui-ios" build CODE_SIGNING_ALLOWED=NO

  distribution:
    name: Distribution contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 拉取表情 / 贴纸素材（webp 不入库，见 assets/emoji-sticker/fetch-assets.sh）
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash assets/emoji-sticker/fetch-assets.sh
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tooling/check-kit-distribution.mjs
      - run: node tooling/check-package-exports.mjs
      - run: node tooling/check-token-fallbacks.mjs
