name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      baselines:
        description: >-
          Render the Linux visual baselines (Playwright screenshots and Flutter goldens) on this runner image and
          upload them for review instead of comparing (docs/release/visual-baselines.md)
        type: boolean
        default: false

jobs:
  quality:
    name: Design system contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 拉取表情 / 贴纸素材（webp 不入库，见 assets/emoji-sticker/fetch-assets.sh）
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash assets/emoji-sticker/fetch-assets.sh
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  vue:
    name: Vue package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 拉取表情 / 贴纸素材（webp 不入库，见 assets/emoji-sticker/fetch-assets.sh）
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash assets/emoji-sticker/fetch-assets.sh
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix packages/vue-im-ui test
      - run: npm --prefix packages/vue-im-ui run typecheck
      - run: npm --prefix packages/vue-im-ui run build
      - run: npm --prefix packages/vue-im-ui run pack
      - run: node tooling/check-package-exports.mjs

  website:
    name: Website and visual regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 拉取表情 / 贴纸素材（webp 不入库，见 assets/emoji-sticker/fetch-assets.sh）
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash assets/emoji-sticker/fetch-assets.sh
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix website run build
      - run: npx --prefix website playwright install --with-deps chromium
      - run: npm --prefix website run test:visual
        if: ${{ !inputs.baselines }}
      # Linux screenshots are renderings of this image: they are made here, reviewed, then committed.
      - name: Render the Linux baselines
        if: ${{ inputs.baselines }}
        run: npm --prefix website run test:visual -- --update-snapshots=all
      - uses: actions/upload-artifact@v4
        if: ${{ always() && (inputs.baselines || failure()) }}
        with:
          name: website-visual
          path: |
            tests/visual/vue/baselines/linux/
            website/test-results/

  flutter:
    name: Flutter package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/flutter-im-ui
    steps:
      - uses: actions/checkout@v4
      - name: 拉取表情 / 贴纸素材（webp 不入库，见 assets/emoji-sticker/fetch-assets.sh）
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash assets/emoji-sticker/fetch-assets.sh
        working-directory: .
      # Pinned: goldens are renderings of one engine, and a floating channel moves them under the baselines.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
        if: ${{ !inputs.baselines }}
      - name: Render the Linux goldens
        if: ${{ inputs.baselines }}
        run: flutter test --update-goldens test/goldens
      - uses: actions/upload-artifact@v4
        if: ${{ always() && (inputs.baselines || failure()) }}
        with:
          name: flutter-goldens
          path: |
            packages/flutter-im-ui/test/goldens/baselines/linux/
            packages/flutter-im-ui/test/goldens/failures/
      - run: dart pub publish --dry-run
      - run: flutter pub get
        working-directory: examples/flutter
      - run: flutter build web
        working-directory: examples/flutter

  android:
    name: Android Compose package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/android-im-ui
    steps:
      - uses: actions/checkout@v4
      - name: 拉取表情 / 贴纸素材（webp 不入库，见 assets/emoji-sticker/fetch-assets.sh）
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash assets/emoji-sticker/fetch-assets.sh
        working-directory: .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      # Without /dev/kvm the emulator falls back to software emulation and the instrumentation process dies
      # before its first test ("Process crashed", 0 tests).
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator interaction regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          working-directory: packages/android-im-ui
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            packages/android-im-ui/build/reports/
            packages/android-im-ui/build/outputs/aar/
            packages/android-im-ui/build/outputs/androidTest-results/

  swift:
    name: SwiftUI package
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/ios-im-ui
    steps:
      - uses: actions/checkout@v4
      - name: 拉取表情 / 贴纸素材（webp 不入库，见 assets/emoji-sticker/fetch-assets.sh）
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash assets/emoji-sticker/fetch-assets.sh
        working-directory: .
      - run: swift package resolve
      - run: ./sync-resources.sh
      - run: swift test
      - run: swift build
      - run: xcodebuild -scheme FlareIMUI -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/flare-ui-ios" build CODE_SIGNING_ALLOWED=NO

  distribution:
    name: Distribution contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 拉取表情 / 贴纸素材（webp 不入库，见 assets/emoji-sticker/fetch-assets.sh）
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash assets/emoji-sticker/fetch-assets.sh
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tooling/check-kit-distribution.mjs
      - run: node tooling/check-package-exports.mjs
      - run: node tooling/check-token-fallbacks.mjs
