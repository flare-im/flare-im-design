name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  spec:
    name: 组件契约校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 校验契约完整性 + 各端符号确实存在 + 文档计数未过期。
      # 这一条能挡住「契约撒谎」——声明了某端符号但实际不存在，
      # 照契约去接的人会直接踩空。
      - name: 契约校验
        run: node validate.mjs
        working-directory: spec

      # README 的组件目录是生成的，防止手改后与契约漂移。
      # 这份目录曾经手写，写着 18 个组件而实际有 107 个，少说了 6 倍。
      - name: README 目录是否最新
        run: node gen-readme-catalog.mjs --check
        working-directory: spec

  tokens:
    name: 设计令牌
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # tokens.json 是全库唯一视觉真源，dist 是它的生成产物。
      # 若源改了却没重新 build，各端拿到的令牌就与真源不一致。
      - name: 构建并检查产物是否与源同步
        working-directory: tokens
        run: |
          npm run build
          if ! git diff --quiet -- dist; then
            echo "::error::dist 与 tokens.json 不同步，请在本地运行 npm run build 后提交"
            git diff --stat -- dist
            exit 1
          fi
          echo "✅ dist 与 tokens.json 同步"

  vue:
    name: Vue 组件库
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # @flare-im/sdk 与 @flare-im/tokens 都已发布，从 registry 装即可 ——
      # 此前 sdk 是跨仓 file: 依赖，CI 里根本装不到，只能写成「允许失败」，
      # 那等于一条永远不会把关的门禁。改成 registry 依赖后才真正有效。
      - name: 安装依赖
        working-directory: vue-im-ui
        run: npm install --no-audit --no-fund

      - name: 类型检查
        working-directory: vue-im-ui
        run: npm run typecheck

      - name: 单元测试
        working-directory: vue-im-ui
        run: npm test --if-present

      # SFC 的编译期错误**躲得过 vue-tsc**（模板里的错在 SFC 编译阶段才暴露），
      # 而 barrel 转出全部组件 —— 一个坏 SFC 会让每个消费方整片空白。
      # 这个门禁早就写好了，但一直没接进 CI，等于没有。
      - name: 全量 SFC 编译
        working-directory: vue-im-ui
        run: npm run check:sfc

      # 表情/贴纸元数据是从仓库上层的真源拷进包内的（发布包不能引用 ../..）。
      # 拷贝漂移过一次：发布出去的 1.0.6 缺这两个 json，装了 npm 包的消费方
      # 直接构建失败，而本地 alias 指向真源所以完全无感。
      - name: 包内元数据与真源一致
        working-directory: vue-im-ui
        run: npm run check:assets

  distribution:
    name: 分发一致性
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 是必须的：门禁要读 git tag，浅克隆拿不到 tag，
      # 会变成「没有 tag 所以没有不一致」的假绿。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 三处版本号（npm / Android / git tag）与 SPM 双清单必须一致。
      # iOS 的 SPM 版本**只**来自 git tag：tag 落后就是静默拿旧代码，
      # 表现成「Android 和 iOS 的 UI 不一样」，本地完全测不出来。
      - name: 版本锁步 + SPM 双清单
        run: node scripts/check-kit-distribution.mjs

      # 对着**打包产物**验 exports：消费方 import 的每个子路径都要解析到包里
      # 真实存在的文件。工作区里 vite alias 与 tsconfig paths 会掩盖 exports 的
      # 错漏，只有真装包才炸——这一条把「装包」这件事里能自包含的部分搬进 CI。
      #
      # 完整判据是工作区根的 verify-published-kit.mjs（真装真构建），
      # 但它需要同级的消费方仓，而那些不是公开仓，CI 拉不到。
      - name: 打包产物的 exports 解析
        run: node scripts/check-package-exports.mjs

  site:
    name: 文档站构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 文档站的 51 个 demo 用的是**真组件**（曾经是本地副本，会与真库漂移）。
      # 所以这条构建同时是「全部组件在真实渲染路径下能跑通」的端到端门禁 ——
      # 比单测覆盖面更宽，此前完全不在 CI 里。
      #
      # site 通过 file:../vue-im-ui 引本仓的包，是同仓相对路径，
      # 不涉及 main/dev 的依赖模式问题。
      # site 通过 file:../vue-im-ui 引本仓的包 —— 而 **file: 链接不会把被链包的
      # 依赖装进消费方**：npm 只建符号链接。kit 源码里 import 的
      # lucide-vue-next / naive-ui 等要靠 vue-im-ui/node_modules 才解析得到。
      #
      # 本地之所以一直没暴露：谁都在 vue-im-ui 里跑过 npm install。CI 的 job
      # 之间不共享状态，所以这一步必须显式装。
      #
      # 注意这跟发布路径无关：装 registry 包的消费方能通过**传递依赖**拿到
      # lucide（已验证 social app 的 node_modules 里有），不需要自己声明。
      - name: 安装 kit 依赖（file: 链接不会自动装）
        working-directory: vue-im-ui
        run: npm install --no-audit --no-fund

      - name: 安装依赖
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: 构建
        working-directory: site
        run: npm run build
